<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tamarii Batiii Duck</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #dff6ff, #fff7d6);
      font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    }

    .scene {
      text-align: center;
      position: relative;
    }

    .title {
      font-size: 42px;
      font-weight: bold;
      color: #ff6fae;
      text-shadow:
        2px 2px 0 #ffffff,
        4px 4px 0 #ffd6e7;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .duck {
      position: relative;
      width: 220px;
      height: 180px;
      margin: 0 auto;
    }

    .body {
      position: absolute;
      bottom: 0;
      left: 45px;
      width: 130px;
      height: 95px;
      background: #ffe066;
      border-radius: 55% 55% 50% 50%;
      border: 4px solid #333;
    }

    .wing {
      position: absolute;
      top: 30px;
      left: 70px;
      width: 65px;
      height: 45px;
      background: #ffd43b;
      border: 4px solid #333;
      border-radius: 50%;
      transform: rotate(-15deg);
    }

    .head {
      position: absolute;
      top: 15px;
      left: 120px;
      width: 70px;
      height: 70px;
      background: #ffe066;
      border: 4px solid #333;
      border-radius: 50%;
    }

    .eye {
      position: absolute;
      top: 25px;
      left: 42px;
      width: 10px;
      height: 10px;
      background: #222;
      border-radius: 50%;
    }

    .beak {
      position: absolute;
      top: 38px;
      left: 58px;
      width: 30px;
      height: 18px;
      background: #ff922b;
      border: 4px solid #333;
      border-radius: 40% 60% 60% 40%;
    }

    .blush {
      position: absolute;
      top: 42px;
      left: 18px;
      width: 14px;
      height: 14px;
      background: #ffb3c7;
      border-radius: 50%;
      opacity: 0.8;
    }

    .tail {
      position: absolute;
      top: 70px;
      left: 28px;
      width: 28px;
      height: 28px;
      background: #ffe066;
      border-left: 4px solid #333;
      border-top: 4px solid #333;
      transform: rotate(-35deg);
      border-radius: 8px;
    }

    .leg {
      position: absolute;
      bottom: -20px;
      width: 4px;
      height: 24px;
      background: #333;
    }

    .leg.left {
      left: 90px;
    }

    .leg.right {
      left: 130px;
    }

    .foot {
      position: absolute;
      bottom: -26px;
      width: 22px;
      height: 8px;
      background: #ff922b;
      border: 3px solid #333;
      border-radius: 10px;
    }

    .foot.left {
      left: 79px;
    }

    .foot.right {
      left: 119px;
    }

    .heart {
      position: absolute;
      font-size: 24px;
      color: #ff6fae;
      animation: float 2s ease-in-out infinite;
    }

    .heart.one {
      top: -10px;
      left: 10px;
    }

    .heart.two {
      top: 10px;
      right: 0;
      animation-delay: 0.6s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="title">Tamarii Batiii</div>

    <div class="duck">
      <div class="heart one">♥</div>
      <div class="heart two">♥</div>

      <div class="tail"></div>
      <div class="body">
        <div class="wing"></div>
      </div>

      <div class="head">
        <div class="eye"></div>
        <div class="blush"></div>
        <div class="beak"></div>
      </div>

      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="foot left"></div>
      <div class="foot right"></div>
    </div>
  </div>
</body>
</html>
